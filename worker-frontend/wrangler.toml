name = "leo-cpacc2"
main = "src/index.js"
compatibility_date = "2024-11-18"
# account_id is read from CLOUDFLARE_ACCOUNT_ID environment variable

# Assets binding - serves static files from a directory
[assets]
directory = "../"
# Exclude worker and git directories
exclude = ["worker/**", "worker-frontend/**", ".git/**", "node_modules/**"]

[[r2_buckets]]
binding = "FLASHCARDS_BUCKET"
bucket_name = "leo-cpacc-r2"
