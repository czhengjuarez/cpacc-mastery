<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }
        .skeleton {
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
        
        /* Hourglass animation */
        @keyframes hourglass-fill {
            0% { height: 0%; }
            45% { height: 100%; }
            50% { height: 100%; }
            100% { height: 100%; }
        }
        
        @keyframes hourglass-flip {
            0%, 45% { transform: rotate(0deg); }
            50%, 100% { transform: rotate(180deg); }
        }
        
        .hourglass-container {
            animation: hourglass-flip 4s infinite ease-in-out;
            transform-origin: center;
        }
        
        .hourglass-sand {
            animation: hourglass-fill 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-stone-100 min-h-screen">
    <!-- Progress Bar -->
    <div id="progress-bar-container" class="w-full bg-gray-200 h-2 transition-opacity duration-1000">
        <div id="progress-bar" class="bg-black h-2 transition-all duration-300" style="width: 0%"></div>
    </div>
    
    <div class="container mx-auto max-w-2xl px-4 pt-16 pb-8">
        <div class="flashcard-container mb-8">
            <!-- Card Counter -->
            <div class="text-center mb-4">
                <span id="card-counter" class="text-gray-600 font-medium">1 / 3</span>
            </div>
            
            <!-- Flashcard -->
            <div id="flashcard" class="bg-white rounded-2xl shadow-md p-8 border border-gray-200 mb-6 min-h-[500px] flex flex-col">
                <div class="flex justify-end items-start mb-6">
                    <a href="welcome.html" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </a>
                </div>
                
                <div class="flex-1 flex flex-col">
                    <h2 id="term-text" class="text-2xl font-bold text-gray-900 mb-6 text-center">[Term]</h2>
                    
                    <!-- Definition area with skeleton animation -->
                    <div id="definition-area" class="flex-1 bg-gray-200 rounded-2xl p-6 mb-6 flex flex-col items-center justify-center skeleton relative">
                        <!-- Timer (shown initially) -->
                        <div id="timer-display" class="flex flex-col items-center gap-2 text-gray-600 mb-4">
                            <svg class="w-6 h-6 hourglass-container" viewBox="0 0 24 24" fill="none">
                                <!-- Hourglass outline -->
                                <path d="M6 2h12M6 22h12M8 2v3.5c0 1.5 1 2.5 2 3.5l2 2-2 2c-1 1-2 2-2 3.5V22M16 2v3.5c0 1.5-1 2.5-2 3.5l-2 2 2 2c1 1 2 2 2 3.5V22" 
                                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <!-- Sand (bottom half) -->
                                <g class="hourglass-sand">
                                    <rect x="8" y="16" width="8" height="0" fill="currentColor" opacity="0.6">
                                        <animate attributeName="height" values="0;6;0" dur="4s" repeatCount="indefinite"/>
                                        <animate attributeName="y" values="22;16;22" dur="4s" repeatCount="indefinite"/>
                                    </rect>
                                </g>
                            </svg>
                            <span id="timer" class="text-lg font-semibold">0:00</span>
                        </div>
                        <!-- Definition text (hidden initially) -->
                        <p id="definition-text" class="text-base text-gray-700 leading-relaxed text-center hidden">[Definition]</p>
                    </div>
                    
                    <!-- Reveal button (shown initially) -->
                    <button id="reveal-btn" class="w-full px-6 py-3 bg-black text-white font-medium rounded-lg hover:bg-gray-800 transition-all duration-200 shadow-lg hover:shadow-xl mb-4">
                        Tap to reveal
                    </button>
                    
                    <!-- Action buttons (hidden initially) -->
                    <div id="action-buttons" class="hidden flex gap-4">
                        <button id="got-it-btn" class="flex-1 px-6 py-3 bg-white text-gray-700 font-medium rounded-lg border-2 border-gray-300 hover:bg-gray-50 transition-all duration-200 shadow hover:shadow-lg">
                            Got it right
                        </button>
                        <button id="practice-btn" class="flex-1 px-6 py-3 bg-white text-gray-700 font-medium rounded-lg border-2 border-gray-300 hover:bg-gray-50 transition-all duration-200 shadow hover:shadow-lg">
                            Needs practice
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Completion Screen (Hidden by default) -->
        <div id="completion-screen" class="hidden max-w-2xl mx-auto text-center py-12">
            <h1 class="text-5xl font-bold text-gray-900 mb-4">Session Completed!</h1>
            <p class="text-xl text-gray-600 mb-12">You have completed all of the cards in this category.</p>
            
            <!-- Performance Gauge -->
            <div class="mb-12">
                <svg id="performance-gauge" width="300" height="180" viewBox="0 0 300 180" class="mx-auto">
                    <!-- Background segments -->
                    <path d="M 30 150 A 120 120 0 0 1 66 48" fill="none" stroke="#DC2626" stroke-width="30" />
                    <path d="M 66 48 A 120 120 0 0 1 126 18" fill="none" stroke="#EA580C" stroke-width="30" />
                    <path d="M 126 18 A 120 120 0 0 1 174 18" fill="none" stroke="#F59E0B" stroke-width="30" />
                    <path d="M 174 18 A 120 120 0 0 1 234 48" fill="none" stroke="#84CC16" stroke-width="30" />
                    <path d="M 234 48 A 120 120 0 0 1 270 150" fill="none" stroke="#22C55E" stroke-width="30" />
                    
                    <!-- Needle -->
                    <g id="gauge-needle" transform="rotate(0 150 150)">
                        <line x1="150" y1="150" x2="150" y2="50" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="150" cy="150" r="8" fill="#374151"/>
                    </g>
                </svg>
                <div class="text-3xl font-bold text-gray-900 mt-6">
                    <span id="score-percentage">0</span>% Correct
                </div>
                <p id="score-label" class="text-base text-gray-600 mt-2">Keep practicing!</p>
            </div>
            
            <div class="flex justify-center gap-8 mb-12">
                <div class="text-center">
                    <div class="text-4xl font-bold text-green-600 mb-1" id="correct-count">0</div>
                    <p class="text-gray-600 font-medium text-sm">Got it right</p>
                </div>
                <div class="text-center">
                    <div class="text-4xl font-bold text-orange-500 mb-1" id="practice-count">0</div>
                    <p class="text-gray-600 font-medium text-sm">Needs practice</p>
                </div>
            </div>
            
            <a href="welcome.html" class="inline-block px-10 py-4 bg-black text-white font-semibold text-lg rounded-xl hover:bg-gray-800 transition-all duration-200 shadow-lg hover:shadow-xl">
                Finish session
            </a>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
