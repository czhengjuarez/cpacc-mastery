<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Flashcard App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen">
    <div class="container mx-auto max-w-4xl px-4 py-8">
        <div class="flex justify-end gap-4 mb-12">
            <button class="px-4 py-2 text-gray-700 font-medium hover:text-gray-900 transition-colors">
                Log-in
            </button>
            <button class="px-6 py-2 border-2 border-gray-800 text-gray-800 font-medium rounded-lg hover:bg-gray-800 hover:text-white transition-all duration-200">
                Register
            </button>
        </div>
        
        <div class="max-w-2xl mx-auto py-20">
            <h1 class="text-6xl font-bold text-gray-900 mb-8">Welcome!</h1>
            
            <div class="flex gap-8 items-start mb-12">
                <!-- Hero Image -->
                <img 
                    src="https://pub-afa2061728444d69a3f322e5bca96ac7.r2.dev/Welcome%20screen/Mind%20the%20gap.png" 
                    alt="Mind the gap - Accessibility through environmental design"
                    class="w-48 h-48 object-cover rounded-2xl shadow-lg flex-shrink-0"
                />
                
                <!-- Body Text -->
                <div class="space-y-4 text-gray-700 text-xl">
                    <p>This app is designed to help you prepare for the Core Competencies Training Exam.</p>
                    <p>You'll review key concepts using simple, focused flashcards — one at a time.</p>
                    <p>Let's get started when you're ready.</p>
                </div>
            </div>
            
            <a href="flashcard.html" class="inline-block px-10 py-4 bg-black text-white font-semibold text-lg rounded-xl hover:bg-gray-800 transition-all duration-200 shadow-lg hover:shadow-xl">
                Let's go
            </a>
        </div>
    </div>
</body>
</html>
